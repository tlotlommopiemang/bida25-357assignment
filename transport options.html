<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Eagle Logistics - Transport Options</title>
  <link rel="stylesheet" href="stylesheet.css">
</head>
<body>
  <header>
    <h1>Eagle Logistics</h1>
    <p>Taking you places in eagle wings</p>
  </header>

  <nav>
    <a href="home page.html">Home</a>
    <a href="index.html">Transport Options</a>
    <a href="about.html">About Us</a>
    <a href="contact.html">Contact</a>
  </nav>

  <main>
  <h2>Our Transport Options</h2>

  <div class="transport-grid">
    <div class="transport">
      <img src="SUV.JPG.jpg" alt="SUV vehicle" class="transport-img">
      <h3>SUV</h3>
      <p>Ride high, presidential style.</p>
    </div>

    <div class="transport">
      <img src="sedan.JPG.jpg" alt="Sedan vehicle" class="transport-img">
      <h3>Sedan</h3>
      <p>Portable, ideal for convenience.</p>
    </div>

    <div class="transport">
      <img src="mini bus.JPG.jpg" alt="Mini bus vehicle" class="transport-img">
      <h3>Mini Bus</h3>
      <p>Perfect for group travel.</p>
    </div>
  </div>
</main>

  <!-- Back to Top Button -->
<button id="backToTop">↑ Top</button>

<!-- JavaScript -->
<script>
  const nav = document.querySelector("nav");
  const backToTop = document.getElementById("backToTop");

  window.addEventListener("scroll", () => {
    // Add shadow to nav when scrolled
    if (window.scrollY > 50) {
      nav.classList.add("scrolled");
    } else {
      nav.classList.remove("scrolled");
    }

    // Show back-to-top button when scrolled down
    if (window.scrollY > 200) {
      backToTop.style.display = "block";
    } else {
      backToTop.style.display = "none";
    }
  });

  // Smooth scroll to top
  backToTop.addEventListener("click", () => {
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
</script>


  <footer>
    <p>&copy; 2026 Eagle Logistics. All rights reserved.</p>
  </footer>
</body>

</html>
